<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XGBoost Pipeline UI</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
    h1 { text-align: center; color: #2c3e50; }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
        background: #fff; border-radius: 10px; padding: 20px 25px;
        margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { margin-top: 0; color: #34495e; border-bottom: 2px solid #eee; padding-bottom: 8px;}
    input[type="file"], input[type="text"], input[type="number"] {
        width: 100%; padding: 8px; margin: 6px 0 14px; border: 1px solid #ccc;
        border-radius: 6px;
    }
    button {
        background: #2980b9; color: white; border: none; padding: 10px 18px;
        border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1f6391; }
    #trainResult, #predictResult { margin-top: 12px; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
    .success { background: #e8f8f0; color: #1e8449; border: 1px solid #a9dfbf; }
    .error { background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px;}
    th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 13px; text-align: center;}
    th { background: #2c3e50; color: white; }
    .feature-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px;}
    .feature-row label { width: 150px; }
    #dynamicFeatures { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
    <h1>🚀 XGBoost Incremental Pipeline</h1>

    <!-- TRAIN SECTION -->
    <div class="card">
        <h2>1. Upload New Training Dataset</h2>
        <input type="file" id="trainFile" accept=".csv">
        <button onclick="uploadTrainingData()">Train / Continue Training</button>
        <div id="trainResult"></div>
    </div>

    <!-- PREDICT SECTION -->
    <div class="card">
        <h2>2. Predict</h2>
        <button onclick="loadSchema()">Load Required Input Fields</button>
        <div id="dynamicFeatures"></div>
        <button onclick="makePrediction()">Predict</button>
        <div id="predictResult"></div>
    </div>

    <!-- METRICS HISTORY -->
    <div class="card">
        <h2>3. Model Evolution / Metrics History</h2>
        <button onclick="loadHistory()">Refresh History</button>
        <div id="historyTable"></div>
    </div>
</div>

<script>
const API_BASE = "http://localhost:8000";

async function uploadTrainingData() {
    const fileInput = document.getElementById("trainFile");
    const resultDiv = document.getElementById("trainResult");

    if (!fileInput.files.length) {
        resultDiv.className = "error";
        resultDiv.innerText = "Please select a CSV file first.";
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    resultDiv.className = "";
    resultDiv.innerText = "Training in progress...";

    try {
        const res = await fetch(`${API_BASE}/train`, { method: "POST", body: formData });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "Training failed");

        resultDiv.className = "success";
        resultDiv.innerText = JSON.stringify(data, null, 2);
        loadHistory();
    } catch (err) {
        resultDiv.className = "error";
        resultDiv.innerText = "Error: " + err.message;
    }
}

async function loadSchema() {
    const container = document.getElementById("dynamicFeatures");
    container.innerHTML = "Loading schema...";
    try {
        const res = await fetch(`${API_BASE}/model/schema`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        container.innerHTML = "";
        data.required_features.forEach(feature => {
            const row = document.createElement("div");
            row.className = "feature-row";
            row.innerHTML = `
                <label>${feature}</label>
                <input type="number" step="any" id="feat_${feature}" placeholder="Enter ${feature}">
            `;
            container.appendChild(row);
        });
    } catch (err) {
        container.innerHTML = `<span style="color:red">${err.message}</span>`;
    }
}

async function makePrediction() {
    const resultDiv = document.getElementById("predictResult");
    const inputs = document.querySelectorAll("[id^='feat_']");

    if (!inputs.length) {
        resultDiv.className = "error";
        resultDiv.innerText = "Load schema first.";
        return;
    }

    const features = {};
    inputs.forEach(input => {
        const name = input.id.replace("feat_", "");
        features[name] = parseFloat(input.value);
    });

    try {
        const res = await fetch(`${API_BASE}/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ features })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        resultDiv.className = "success";
        resultDiv.innerText = "Prediction: " + data.prediction;
    } catch (err) {
        resultDiv.className = "error";
        resultDiv.innerText = "Error: " + err.message;
    }
}

async function loadHistory() {
    const container = document.getElementById("historyTable");
    try {
        const res = await fetch(`${API_BASE}/metrics/history`);
        const data = await res.json();
        const history = data.history;

        if (!history.length) {
            container.innerHTML = "<p>No training history yet.</p>";
            return;
        }

        let html = "<table><tr>" +
            Object.keys(history[0]).map(k => `<th>${k}</th>`).join("") +
            "</tr>";

        history.forEach(row => {
            html += "<tr>" + Object.values(row).map(v => `<td>${v}</td>`).join("") + "</tr>";
        });

        html += "</table>";
        container.innerHTML = html;
    } catch (err) {
        container.innerHTML = `<span style="color:red">${err.message}</span>`;
    }
}

window.onload = loadHistory;
</script>
</body>
</html>
